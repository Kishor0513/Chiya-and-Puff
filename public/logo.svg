  <!-- chiya surface -->
  <ellipse cx="24" cy="27" rx="14" ry="4.5" fill="#C0681D"/>
  <ellipse cx="20" cy="26.5" rx="5" ry="1.6" fill="#E8A93D" opacity="0.85"/>
  <!-- handle -->
  <path d="M38 32 c6.5-1 9 2.5 8 6.5 c-1 4-4.5 6-8.5 5.5" fill="none" stroke="#6B4423" stroke-width="3" stroke-linecap="round"/>
  <!-- steam -->
  <path d="M20 19 c-2.5-3 2.5-4.5 0-7.5" fill="none" stroke="#C0681D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 19 c-2.5-3 2.5-4.5 0-7.5" fill="none" stroke="#C0681D" stroke-width="2.5" stroke-linecap="round"/>
